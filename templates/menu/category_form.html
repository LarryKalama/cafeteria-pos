{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - Cafeteria POS{% endblock %}

{% block content %}
<div class="container-fluid">
    <h4>{{ title }}</h4>

    <div class="card mt-4">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'menu:category_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
