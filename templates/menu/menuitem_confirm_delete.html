{% extends 'base.html' %}

{% block title %}Delete Category - Cafeteria POS{% endblock %}

{% block content %}
<div class="container-fluid">
    <h4>Confirm Delete</h4>
    <p>Are you sure you want to delete category <strong>{{ category.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'menu:category_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
